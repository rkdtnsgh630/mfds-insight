name: inspect

# 게시된 수집 DB의 필드 구성을 점검한다. 수동 실행만. API 호출·DB 변경 없음.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: DB 내려받기
        run: |
          mkdir -p data
          gh release download data-latest -p mfds.sqlite.gz -D data --repo "$GITHUB_REPOSITORY"
          gunzip -f data/mfds.sqlite.gz
      - name: 필드 점검
        run: python -m sitebuild.inspect_db --db data/mfds.sqlite --summary "$GITHUB_STEP_SUMMARY"
