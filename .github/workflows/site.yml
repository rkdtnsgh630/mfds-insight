name: site

# 수집 DB로 화면용 JSON을 만들어 Release(data-latest)에 site-data.tar.gz로 올린다.
# 수집(collect)이 성공하면 자동으로 이어서 실행된다. API는 호출하지 않는다.
# 이어서 GitHub Pages(https://rkdtnsgh630.github.io/mfds-insight/)에 배포한다. 검색엔진 노출은 막는다(noindex).
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["collect"]
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 단위 시험
        run: python -m unittest discover -s tests -v
      - name: DB 내려받기
        run: |
          mkdir -p data
          gh release download data-latest -p mfds.sqlite.gz -D data --repo "$GITHUB_REPOSITORY"
          gunzip -f data/mfds.sqlite.gz
      - name: 화면용 데이터 생성
        run: python -m sitebuild.export --db data/mfds.sqlite --out site/data --summary "$GITHUB_STEP_SUMMARY"
      - name: Release에 올리기
        run: |
          tar -czf site-data.tar.gz -C site data
          ls -la site-data.tar.gz
          gh release upload data-latest site-data.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
      - name: Pages 배포 파일 준비 (검색엔진 차단 점검)
        run: |
          grep -q 'name="robots" content="noindex' site/index.html || { echo "오류: index.html에 noindex 없음"; exit 1; }
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
