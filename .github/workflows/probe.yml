name: probe

# 요청변수 동작 확인용 시험 호출. 수동 실행만. DB를 만들거나 게시하지 않는다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 시험 호출
        env:
          MFDS_SERVICE_KEY: ${{ secrets.MFDS_SERVICE_KEY }}
        run: python -m collector.probe --summary "$GITHUB_STEP_SUMMARY"
