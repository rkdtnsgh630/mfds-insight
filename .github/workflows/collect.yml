name: collect

on:
  schedule:
    - cron: "0 18 * * *"   # 매일 03:00 KST: tier:core 11개 (제품허가 상세는 변경분만)
    - cron: "0 19 1 * *"   # 매월 1일 04:00 KST: 제품허가 상세 전체 (--full, 결측 점검)
  workflow_dispatch:
    inputs:
      apis:
        description: "수집 대상 (tier:core | tier:hold | tier:core+hold | all | id1,id2)"
        required: false
        default: "tier:core"
      max_pages:
        description: "API당 최대 페이지 (0=전체). 0이 아니면 시험 실행으로 보고 DB를 게시하지 않음"
        required: false
        default: "0"
      rows:
        description: "페이지당 건수"
        required: false
        default: "500"
      full:
        description: "증분 대상(제품허가 상세)도 전체 수집"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 단위 시험
        run: python -m unittest discover -s tests -v

  collect:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
      APIS: ${{ github.event.inputs.apis || (github.event.schedule == '0 19 1 * *' && 'drug_permit_detail') || 'tier:core' }}
      FULL: ${{ github.event.inputs.full || (github.event.schedule == '0 19 1 * *' && 'true') || 'false' }}
      MAX_PAGES: ${{ github.event.inputs.max_pages || '0' }}
      ROWS: ${{ github.event.inputs.rows || '500' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 이전 DB 내려받기
        run: |
          mkdir -p data
          # 보관 원칙: 이전 DB가 Release에 있는데 못 받으면 새로 시작하지 않고 멈춘다 (빈 DB로 덮어쓰면 이력이 사라짐)
          if gh release view data-latest --repo "$GITHUB_REPOSITORY" --json assets -q ".assets[].name" 2>/dev/null | grep -qx "mfds.sqlite.gz"; then
            gh release download data-latest -p mfds.sqlite.gz -D data --repo "$GITHUB_REPOSITORY" || { echo "오류: 이전 DB 내려받기 실패. 이력 보호를 위해 수집을 중단합니다."; exit 1; }
            gunzip -kf data/mfds.sqlite.gz
            mv data/mfds.sqlite.gz data/prev.sqlite.gz
            cp data/mfds.sqlite data/prev.sqlite      # 게시 전 보관 점검용
            echo "이전 DB를 이어서 사용합니다."
          else
            echo "이전 DB가 없습니다 (최초 실행)."
          fi

      - name: 수집
        env:
          MFDS_SERVICE_KEY: ${{ secrets.MFDS_SERVICE_KEY }}
          TRIGGER: ${{ github.event_name }}
        run: |
          FULL_FLAG=""
          if [ "$FULL" = "true" ]; then FULL_FLAG="--full"; fi
          python -m collector.run --db data/mfds.sqlite --apis "$APIS" --rows "$ROWS" \
            --max-pages "$MAX_PAGES" --trigger "$TRIGGER" --summary data/last_run.json $FULL_FLAG

      - name: 보관 점검 (기록이 줄었으면 게시 중단)
        if: env.MAX_PAGES == '0'
        run: |
          if [ -f data/prev.sqlite ]; then
            python -m collector.guard --prev data/prev.sqlite --new data/mfds.sqlite --summary "$GITHUB_STEP_SUMMARY"
          else
            echo "이전 DB 없음 (최초 실행) → 점검 생략"
          fi

      - name: DB 게시 (Release data-latest)
        if: env.MAX_PAGES == '0'
        run: |
          gzip -kf data/mfds.sqlite
          if ! gh release view data-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create data-latest --repo "$GITHUB_REPOSITORY" --latest=false \
              --title "수집 데이터 (최신)" \
              --notes "GitHub Actions가 갱신하는 SQLite DB(mfds.sqlite.gz)와 최근 실행 요약(last_run.json)입니다."
          fi
          gh release upload data-latest data/mfds.sqlite.gz data/last_run.json --clobber --repo "$GITHUB_REPOSITORY"

      - name: 주간 백업 (일요일, 최근 8주 보관)
        if: env.MAX_PAGES == '0'
        run: |
          # KST 기준 일요일이거나 아직 백업이 하나도 없으면 날짜를 붙인 사본을 남긴다
          DOW=$(TZ=Asia/Seoul date +%u); TAG=$(TZ=Asia/Seoul date +%Y%m%d)
          NAMES=$(gh release view data-latest --repo "$GITHUB_REPOSITORY" --json assets -q ".assets[].name")
          if [ "$DOW" = "7" ] || ! echo "$NAMES" | grep -q "^mfds-backup-"; then
            cp data/mfds.sqlite.gz "data/mfds-backup-$TAG.sqlite.gz"
            gh release upload data-latest "data/mfds-backup-$TAG.sqlite.gz" --clobber --repo "$GITHUB_REPOSITORY"
            NAMES=$(gh release view data-latest --repo "$GITHUB_REPOSITORY" --json assets -q ".assets[].name")
            echo "$NAMES" | grep "^mfds-backup-" | sort | head -n -8 | while read -r OLD; do
              gh release delete-asset data-latest "$OLD" --yes --repo "$GITHUB_REPOSITORY"
            done
          fi
